<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finanças{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_v('icons.css') }}">
  <link rel="stylesheet" href="{{ static_v('style.css') }}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand-card">
        <img class="brand-avatar" src="{{ url_for('static', filename='img/lolinha-avatar.jpg') }}" alt="Lolinha">
        <div class="brand-name">Pluto Finanças</div>
      </div>

      <nav class="nav">
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
        <a href="{{ url_for('transactions') }}" class="{{ 'active' if request.endpoint == 'transactions' }}"><i class="ti ti-list"></i> Lançamentos</a>
        <a href="{{ url_for('budgets') }}" class="{{ 'active' if request.endpoint == 'budgets' }}"><i class="ti ti-target"></i> Orçamentos</a>
        <a href="{{ url_for('import_ofx') }}" class="{{ 'active' if request.endpoint == 'import_ofx' }}"><i class="ti ti-arrow-bar-to-down"></i> Importar</a>
        <a href="{{ url_for('accounts') }}" class="{{ 'active' if request.endpoint == 'accounts' }}"><i class="ti ti-building-bank"></i> Contas</a>
      </nav>

      <div class="nav-group">Patrimônio</div>
      <nav class="nav">
        <a href="{{ url_for('assets') }}" class="{{ 'active' if request.endpoint == 'assets' }}">
          <span><i class="ti ti-diamond"></i> Bens e Direitos</span>
          <span class="nav-meta">{{ nw_bens|kmil }}</span>
        </a>
      </nav>
    </aside>

    <main class="content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
