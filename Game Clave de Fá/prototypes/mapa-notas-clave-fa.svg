<title>Clave de fá: ordem em que as notas são liberadas no jogo</title>
<desc>Pentagrama em clave de fá com treze notas em escada ascendente, do mi grave ao dó central. As notas centrais dó ré mi são liberadas primeiro, depois fá e sol, depois lá, depois a oitava grave e por fim as linhas suplementares.</desc>

